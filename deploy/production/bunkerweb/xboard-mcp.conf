# XBOARD-MCP-COMPAT
# The authenticated MCP endpoint carries JSON-RPC payloads that can trigger
# generic CRS rules. Keep the exception exact and leave all other panel paths
# under the service-wide ModSecurity policy and existing request limits.
location = /api/mcp {
    modsecurity off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;
    client_max_body_size 2m;

    proxy_pass http://xboard-theme:80;
}
