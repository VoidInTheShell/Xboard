name: Docker Build, Publish and Deploy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Formal version (vX.Y.Z); publish only, never deploy. Empty keeps the transitional workflow."
        required: false
        type: string
      admin_version:
        description: "Exact Admin release for the panel suite; empty selects the newest compatible published version."
        required: false
        type: string
      theme_version:
        description: "Exact Theme release for the panel suite; empty selects the newest compatible published version."
        required: false
        type: string
      deployment_target:
        description: Legacy staging/production selector. Deploy jobs are disabled by false guards, so manual dispatch only builds, tests, and publishes. Retained for the recovery path.
        required: false
        default: staging
        type: choice
        options:
          - staging
          - production
      dk_theme_image:
        description: DK Theme GHCR image with version tag for the (currently disabled) full-stack rebuild job. Defaults to the staging Environment variable.
        required: false
        type: string
      xboard_admin_image:
        description: Xboard-Admin GHCR image with version tag for the (currently disabled) full-stack rebuild job. Defaults to the staging Environment variable.
        required: false
        type: string
      production_dk_theme_image:
        description: DK Theme GHCR image with version tag for the (currently disabled) manual JPGREEN production deploy job. Defaults to the production Environment variable.
        required: false
        type: string
      production_xboard_admin_image:
        description: Xboard-Admin GHCR image with version tag for the (currently disabled) manual JPGREEN production deploy job. Defaults to the production Environment variable.
        required: false
        type: string
      reset_jpgreen_data:
        description: Move the existing JPGREEN Xboard data to a protected backup and create a fresh production database.
        required: false
        default: false
        type: boolean
      reset_confirmation:
        description: Type RESET JPGREEN XBOARD DATA when reset_jpgreen_data is enabled.
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: voidintheshell/xboard

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-image:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build local smoke-test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: xboard-ci:build-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            APP_VERSION=build-${{ github.run_id }}-${{ github.run_attempt }}
            INSTALL_DEV_DEPENDENCIES=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run PHP test suite
        run: |
          docker run --rm --entrypoint sh \
            --env APP_ENV=testing \
            --env APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --env CACHE_DRIVER=array \
            --env DB_CONNECTION=sqlite \
            --env DB_DATABASE=database/testing.sqlite \
            --env QUEUE_CONNECTION=sync \
            --env SESSION_DRIVER=array \
            --env REDIS_HOST=127.0.0.1 \
            --env REDIS_PORT=6379 \
            xboard-ci:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            -c 'redis-server --daemonize yes && touch database/testing.sqlite && php vendor/bin/phpunit tests --colors=never --fail-on-empty-test-suite'

      - name: Verify Artisan boot and staging command registration
        run: |
          docker run --rm xboard-ci:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} php artisan list --format=json > /tmp/artisan.json
          grep -q 'xboard:staging-bootstrap' /tmp/artisan.json

      - name: Validate deployment assets
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/staging/deploy.sh
          bash -n deploy/production/deploy.sh
          bash -n deploy/production/bunkerweb/apply-mcp-compat.sh
          for script in deploy/production/host/*.sh; do bash -n "${script}"; done
          bash -n deploy/updater/bootstrap.sh
          bash -n deploy/updater/panel-hook.sh
          bash -n deploy/compose/validate.sh
          export XBOARD_VERSION=v0.0.1-dev.1.1
          export XBOARD_ADMIN_VERSION=v0.0.1-dev.1.1
          export XBOARD_UPDATER_VERSION=v0.0.1-dev.1.1
          export XBOARD_DEPLOY_DIR="${GITHUB_WORKSPACE}"
          export XBOARD_PANEL_URL=https://panel.validation.invalid
          ./deploy/compose/validate.sh compose.sample.yaml
          docker compose -f deploy/staging/compose.yaml config --no-interpolate > /dev/null
          docker compose -f deploy/production/compose.yaml config --no-interpolate > /dev/null
          docker run --rm --entrypoint php \
            --volume "${GITHUB_WORKSPACE}/deploy/production/bootstrap/production-bootstrap.php:/tmp/production-bootstrap.php:ro" \
          xboard-ci:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} -l /tmp/production-bootstrap.php
          docker run --rm --entrypoint php \
            --volume "${GITHUB_WORKSPACE}/deploy/shared/sqlite-data-guard.php:/tmp/sqlite-data-guard.php:ro" \
          xboard-ci:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} -l /tmp/sqlite-data-guard.php
          docker run --rm --entrypoint php \
            --volume "${GITHUB_WORKSPACE}/deploy/production/recovery/merge-server-configuration.php:/tmp/merge-server-configuration.php:ro" \
          xboard-ci:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} -l /tmp/merge-server-configuration.php
          docker run --rm --entrypoint php \
            --volume "${GITHUB_WORKSPACE}/deploy:/workspace/deploy:ro" \
          xboard-ci:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} /workspace/deploy/tests/data-safety.php
          grep -q '^# XBOARD-MCP-COMPAT$' deploy/production/bunkerweb/xboard-mcp.conf
          grep -q '^# XBOARD-NODE-CONTROL-COMPAT$' deploy/production/bunkerweb/xboard-mcp.conf
          grep -Fq 'location ^~ /api/v2/server/' deploy/production/bunkerweb/xboard-mcp.conf
          grep -Fq 'location ^~ /api/v1/server/' deploy/production/bunkerweb/xboard-mcp.conf
          test "$(grep -Fc 'proxy_intercept_errors off;' deploy/production/bunkerweb/xboard-mcp.conf)" = 3
          grep -Fq 'docker exec -u 0 "$SCHEDULER" rm -f /tmp/xboard-mcp-compat.conf' deploy/production/bunkerweb/apply-mcp-compat.sh
          grep -Fq -- '--retry 4 --retry-all-errors --retry-delay 2' deploy/production/host/verify-production.sh
          sudo bash deploy/production/host/xboard-ci-dispatcher.sh health \
            | grep -qx 'principal=xboard-ci forced_command=ready'
          if sudo bash deploy/production/host/xboard-ci-dispatcher.sh 'uname -a'; then exit 1; fi
          if sudo bash deploy/production/host/xboard-ci-dispatcher.sh 'deploy-xboard invalid'; then exit 1; fi

      - name: Smoke-test production bootstrap with disposable data
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint sh \
            --volume "${GITHUB_WORKSPACE}/deploy/production/bootstrap/production-bootstrap.php:/bootstrap/production-bootstrap.php:ro" \
            --tmpfs /www/.docker/.data \
            --tmpfs /data \
            --tmpfs /runtime-secrets \
            --env APP_ENV=production \
            --env APP_URL=https://validation.invalid \
            --env ENABLE_SQLITE=true \
            --env ENABLE_REDIS=true \
            --env ADMIN_ACCOUNT=admin@validation.invalid \
            --env ADMIN_PASSWORD_FILE=/tmp/admin_password \
            --env SERVER_TOKEN_FILE=/tmp/server_token \
            --env TEST_USER_PASSWORD_FILE=/tmp/test_password \
            --env PRODUCTION_TEST_USER_EMAIL=test@validation.invalid \
            --env MCP_KEY_OUTPUT_FILE=/runtime-secrets/xboard_mcp_key \
            --env PRODUCTION_BOOTSTRAP_CONFIRM=1 \
            xboard-ci:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} -ec '
              install -m 600 /dev/null /tmp/admin_password
              install -m 600 /dev/null /tmp/test_password
              install -m 600 /dev/null /tmp/server_token
              printf %s ValidationAdmin1234 > /tmp/admin_password
              printf %s ValidationUser1234 > /tmp/test_password
              printf %s 0123456789abcdef0123456789abcdef > /tmp/server_token
              install -m 600 /dev/null /www/.env
              php artisan xboard:install --no-interaction > /tmp/install.log
              redis-server --unixsocket /data/redis.sock --unixsocketperm 770 --port 0 --daemonize yes --dir /data
              php /bootstrap/production-bootstrap.php
              test "$(stat -c %a /runtime-secrets/xboard_mcp_key)" = 600
              test "$(wc -c < /runtime-secrets/xboard_mcp_key)" -gt 40
              test "$(sqlite3 /www/.docker/.data/database.sqlite "select count(*) from v2_user;")" = 2
              test "$(sqlite3 /www/.docker/.data/database.sqlite "select count(*) from v2_server_group;")" = 1
              test "$(sqlite3 /www/.docker/.data/database.sqlite "select count(*) from v2_mcp_key where revoked_at is null;")" = 1
            '


  prepare-release:
    name: Freeze version and release plan
    if: github.event_name != 'pull_request'
    needs: test-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      plan_artifact: release-plan-${{ steps.plan.outputs.version }}
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Prepare exact version
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          ADMIN_VERSION: ${{ inputs.admin_version || vars.RELEASE_ADMIN_VERSION }}
          THEME_VERSION: ${{ inputs.theme_version || vars.RELEASE_THEME_VERSION }}
        run: python3 .github/scripts/release.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan-${{ steps.plan.outputs.version }}
          overwrite: true
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 30

  build-and-push:
    name: Publish multi-architecture image
    if: github.event_name != 'pull_request'
    needs: [test-image, prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Verify checkout and load frozen plan
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.prepare-release.outputs.plan_artifact }}
          path: ${{ runner.temp }}
      - name: Preserve an already built version on retry
        id: existing-image
        run: python3 .github/scripts/release.py image-check

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        if: steps.existing-image.outputs.exists != 'true'
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare-release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Report staging image tag
        env:
          IMAGE_TAG: ${{ needs.prepare-release.outputs.version }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Published staging image: ${image}"
          printf 'Staging image: `%s`\n' "${image}" >> "$GITHUB_STEP_SUMMARY"

  compose-smoke:
    name: Smoke-test versioned Compose stack (amd64)
    # Full Compose acceptance is run explicitly in the test environment; it
    # is not an automatic dev-publication gate.
    if: >-
      false &&
      github.event_name != 'pull_request' &&
      needs.prepare-release.outputs.publish == 'true'
    needs: [build-and-push, prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load the frozen release manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.prepare-release.outputs.plan_artifact }}
          path: ${{ runner.temp }}
      - name: Start and verify the default Compose stack
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/release-manifest.json
        run: |
          set -Eeuo pipefail
          stack="${RUNNER_TEMP}/xboard-compose"
          mkdir -p "${stack}/.docker/.data" "${stack}/storage/logs" "${stack}/storage/app/public" "${stack}/storage/theme" "${stack}/plugins" "${stack}/deploy/updater"
          cp compose.sample.yaml "${stack}/compose.yaml"
          cp .env.example "${stack}/.env"
          cp deploy/updater/bootstrap.sh deploy/updater/panel-hook.sh "${stack}/deploy/updater/"
          cat > "${stack}/smoke.override.yaml" <<EOF
          services:
            xboard-updater:
              network_mode: host
              networks: !reset []
          EOF
          xboard_version=$(jq -er '.version' "${RELEASE_MANIFEST}")
          admin_version=$(jq -er '.components["xboard-admin"].version' "${RELEASE_MANIFEST}")
          {
            printf 'XBOARD_DEPLOY_DIR=%s\n' "${stack}"
            printf 'XBOARD_VERSION=%s\n' "${xboard_version}"
            printf 'XBOARD_ADMIN_VERSION=%s\n' "${admin_version}"
           printf 'XBOARD_UPDATER_VERSION=%s\n' "${admin_version}"
            printf 'XBOARD_PANEL_URL=%s\n' 'http://127.0.0.1:7001'
            printf 'XBOARD_COMPOSE_FILE=%s\n' "${stack}/compose.yaml"
            printf 'XBOARD_HEALTH_URL=%s\n' 'http://127.0.0.1:7001/'
          } >> "${stack}/.env"
          export XBOARD_DEPLOY_DIR="${stack}"
          export XBOARD_VERSION="${xboard_version}"
          export XBOARD_ADMIN_VERSION="${admin_version}"
          export XBOARD_UPDATER_VERSION="${admin_version}"
          export XBOARD_PANEL_URL=http://127.0.0.1:7001
          ./deploy/compose/validate.sh "${stack}/compose.yaml"
          compose=(docker compose --env-file "${stack}/.env" --project-name xboard -f "${stack}/compose.yaml" -f "${stack}/smoke.override.yaml")
          "${compose[@]}" run --rm -e ENABLE_SQLITE=true -e ENABLE_REDIS=true -e ADMIN_ACCOUNT=admin@validation.invalid xboard php artisan xboard:install
          "${compose[@]}" up -d
          for attempt in $(seq 1 45); do
          if curl --fail --silent --show-error http://127.0.0.1:7003/healthz > /dev/null; then
          break
          fi
          if [ "${attempt}" -eq 45 ]; then
          "${compose[@]}" ps
          "${compose[@]}" logs --tail 200 xboard xboard-admin updater-bootstrap xboard-updater
          exit 1
          fi
          sleep 2
          done
          bootstrap_container=
          for attempt in $(seq 1 60); do
            bootstrap_container=$("${compose[@]}" ps -aq updater-bootstrap)
            if [ -n "${bootstrap_container}" ] && [ "$(docker inspect -f "{{.State.Status}}" "${bootstrap_container}")" = "exited" ]; then
              break
            fi
            sleep 2
          done
          test -n "${bootstrap_container}"
          test "$(docker inspect -f "{{.State.Status}} {{.State.ExitCode}}" "${bootstrap_container}")" = "exited 0"
          heartbeat=missing
          for attempt in $(seq 1 30); do
          heartbeat=$(docker exec xboard-app php -r 'require "/www/vendor/autoload.php"; $app=require "/www/bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo \App\Models\UpdateExecutor::where("scope", "panel")->whereNotNull("last_seen_at")->exists() ? "heartbeat" : "missing";' 2>/dev/null || true)
            if [ "${heartbeat}" = "heartbeat" ]; then
              break
            fi
            sleep 2
          done
          if [ "${heartbeat}" != "heartbeat" ]; then
            "${compose[@]}" logs --tail 200 xboard updater-bootstrap xboard-updater
            exit 1
          fi
          if "${compose[@]}" logs --no-color updater-bootstrap | grep -Eq "xbu_[A-Za-z0-9]+"; then
            echo "bootstrap logs contain an updater credential" >&2
            exit 1
          fi
          test "$(docker inspect -f "{{.Config.Image}}" xboard-app)" = "ghcr.io/voidintheshell/xboard:${xboard_version}"
          test "$(docker inspect -f "{{.Config.Image}}" xboard-admin)" = "ghcr.io/voidintheshell/xboard-admin:${admin_version}"
          test "$(docker inspect -f "{{.Config.Image}}" xboard-updater)" = "ghcr.io/voidintheshell/xboard-admin-updater:${admin_version}"
          "${compose[@]}" ps
          "${compose[@]}" down --remove-orphans
  deploy-staging:
    name: Rebuild GJHK staging
    # Paused while upgrades are validated through the panel-owned updater.
    if: >-
      false &&
      inputs.release_version == '' &&
      startsWith(github.ref, 'refs/heads/') &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deployment_target == 'staging') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/dev')
      )
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: staging-${{ github.repository_id }}
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.STAGING_PANEL_URL }}
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
      SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
      SSH_USER: ${{ vars.STAGING_SSH_USER }}
      PANEL_URL: ${{ vars.STAGING_PANEL_URL }}
      ADMIN_PATH: ${{ vars.STAGING_ADMIN_PATH }}
      NODE_HOST: ${{ vars.STAGING_NODE_HOST }}
      NODE_ID: ${{ vars.STAGING_NODE_ID }}
      NODE_PUBLIC_PORT: ${{ vars.STAGING_NODE_PUBLIC_PORT }}
      NODE_LISTEN_PORT: ${{ vars.STAGING_NODE_LISTEN_PORT }}
      NODE_WS_PATH: ${{ secrets.STAGING_NODE_WS_PATH }}
      ADMIN_ACCOUNT: ${{ secrets.STAGING_ADMIN_ACCOUNT }}
      ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      TEST_USER_EMAIL: ${{ vars.STAGING_TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.STAGING_TEST_USER_PASSWORD }}
      SERVER_TOKEN: ${{ secrets.STAGING_SERVER_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      XBOARD_IMAGE: ghcr.io/voidintheshell/xboard:${{ needs.build-and-push.outputs.image_tag }}
      DK_THEME_IMAGE: ${{ inputs.dk_theme_image || vars.STAGING_DK_THEME_IMAGE }}
      XBOARD_ADMIN_IMAGE: ${{ inputs.xboard_admin_image || vars.STAGING_XBOARD_ADMIN_IMAGE }}
      ADMIN_ROUTE_TOKEN: ${{ secrets.STAGING_ADMIN_ROUTE_TOKEN }}
      REMOTE_BUNDLE: /home/beihai/docker/.incoming/xboard-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate staging configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_HOST:?STAGING_SSH_HOST is required}"
          : "${SSH_PORT:?STAGING_SSH_PORT is required}"
          : "${SSH_USER:?STAGING_SSH_USER is required}"
          : "${PANEL_URL:?STAGING_PANEL_URL is required}"
          : "${ADMIN_PATH:?STAGING_ADMIN_PATH is required}"
          : "${NODE_HOST:?STAGING_NODE_HOST is required}"
          : "${NODE_ID:?STAGING_NODE_ID is required}"
          : "${NODE_PUBLIC_PORT:?STAGING_NODE_PUBLIC_PORT is required}"
          : "${NODE_LISTEN_PORT:?STAGING_NODE_LISTEN_PORT is required}"
          : "${NODE_WS_PATH:?STAGING_NODE_WS_PATH is required}"
          : "${ADMIN_ACCOUNT:?STAGING_ADMIN_ACCOUNT is required}"
          : "${ADMIN_PASSWORD:?STAGING_ADMIN_PASSWORD is required}"
          : "${TEST_USER_EMAIL:?STAGING_TEST_USER_EMAIL is required}"
          : "${TEST_USER_PASSWORD:?STAGING_TEST_USER_PASSWORD is required}"
          : "${SERVER_TOKEN:?STAGING_SERVER_TOKEN is required}"
          : "${DK_THEME_IMAGE:?STAGING_DK_THEME_IMAGE or workflow_dispatch dk_theme_image is required}"
          : "${XBOARD_ADMIN_IMAGE:?STAGING_XBOARD_ADMIN_IMAGE or workflow_dispatch xboard_admin_image is required}"
          : "${ADMIN_ROUTE_TOKEN:?STAGING_ADMIN_ROUTE_TOKEN is required}"
          : "${SSH_PRIVATE_KEY:?STAGING_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?STAGING_SSH_KNOWN_HOSTS is required}"
          if ! [[ "${ADMIN_PATH}" =~ ^[A-Za-z0-9_-]{8,}$ ]] || [ "${ADMIN_PATH}" = 'passport' ]; then
            echo "STAGING_ADMIN_PATH must be a non-reserved secure path" >&2
            exit 1
          fi
          if ! [[ "${ADMIN_ROUTE_TOKEN}" =~ ^[A-Za-z0-9_-]{16,}$ ]]; then
            echo "STAGING_ADMIN_ROUTE_TOKEN must use at least 16 base64url-safe characters" >&2
            exit 1
          fi
          if [ "${#SERVER_TOKEN}" -lt 16 ]; then
            echo "STAGING_SERVER_TOKEN must contain at least 16 characters" >&2
            exit 1
          fi
          if [ "${#TEST_USER_PASSWORD}" -lt 8 ]; then
            echo "STAGING_TEST_USER_PASSWORD must contain at least 8 characters" >&2
            exit 1
          fi
          is_tagged_ghcr_image() {
            local image="$1"
            local repository="$2"
            [[ "${image}" =~ ^ghcr\.io/voidintheshell/${repository}:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          }
          is_tagged_ghcr_image "${XBOARD_IMAGE}" xboard || {
            echo "XBOARD_IMAGE must be an xboard GHCR image with a version tag" >&2
            exit 1
          }
          is_tagged_ghcr_image "${DK_THEME_IMAGE}" dk_theme || {
            echo "DK_THEME_IMAGE must be a DK Theme GHCR image with a version tag" >&2
            exit 1
          }
          is_tagged_ghcr_image "${XBOARD_ADMIN_IMAGE}" xboard-admin || {
            echo "XBOARD_ADMIN_IMAGE must be an Xboard-Admin GHCR image with a version tag" >&2
            exit 1
          }

      - name: Prepare SSH and deployment bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          install -d -m 700 "${SSH_DIR}"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${SSH_DIR}/id_ed25519"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${SSH_DIR}/known_hosts"

          BUNDLE_DIR="${RUNNER_TEMP}/xboard-bundle"
          install -d -m 700 "${BUNDLE_DIR}"
          install -m 644 deploy/staging/compose.yaml "${BUNDLE_DIR}/compose.yaml"
          install -m 700 deploy/staging/deploy.sh "${BUNDLE_DIR}/deploy.sh"
          install -m 644 deploy/shared/sqlite-data-guard.php "${BUNDLE_DIR}/sqlite-data-guard.php"
          install -m 644 deploy/shared/release-maintenance.py "${BUNDLE_DIR}/release-maintenance.py"
          printf '%s' "${ADMIN_PASSWORD}" > "${BUNDLE_DIR}/admin_password"
          printf '%s' "${SERVER_TOKEN}" > "${BUNDLE_DIR}/server_token"
          printf '%s' "${TEST_USER_PASSWORD}" > "${BUNDLE_DIR}/test_user_password"
          printf '%s' "${ADMIN_ROUTE_TOKEN}" > "${BUNDLE_DIR}/admin_route_token"
          chmod 600 "${BUNDLE_DIR}/admin_password" "${BUNDLE_DIR}/server_token" "${BUNDLE_DIR}/test_user_password" "${BUNDLE_DIR}/admin_route_token"
          {
            printf 'XBOARD_IMAGE=%s\n' "${XBOARD_IMAGE}"
            printf 'DK_THEME_IMAGE=%s\n' "${DK_THEME_IMAGE}"
            printf 'XBOARD_ADMIN_IMAGE=%s\n' "${XBOARD_ADMIN_IMAGE}"
            printf 'STAGING_ADMIN_ACCOUNT=%s\n' "${ADMIN_ACCOUNT}"
            printf 'STAGING_TEST_USER_EMAIL=%s\n' "${TEST_USER_EMAIL}"
            printf 'STAGING_PANEL_URL=%s\n' "${PANEL_URL}"
            printf 'STAGING_ADMIN_PATH=%s\n' "${ADMIN_PATH}"
            printf 'STAGING_NODE_NAME=%s\n' 'US3 XHTTP'
            printf 'STAGING_NODE_HOST=%s\n' "${NODE_HOST}"
            printf 'STAGING_NODE_ID=%s\n' "${NODE_ID}"
            printf 'STAGING_NODE_PUBLIC_PORT=%s\n' "${NODE_PUBLIC_PORT}"
            printf 'STAGING_NODE_LISTEN_PORT=%s\n' "${NODE_LISTEN_PORT}"
            printf 'STAGING_NODE_WS_PATH=%s\n' "${NODE_WS_PATH}"
          } > "${BUNDLE_DIR}/deploy.env"
          chmod 600 "${BUNDLE_DIR}/deploy.env"

      - name: Upload and deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          SSH_ARGS=(-i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")
          SCP_ARGS=(-i "${SSH_DIR}/id_ed25519" -P "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")

          ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" "install -d -m 700 '${REMOTE_BUNDLE}'"
          scp "${SCP_ARGS[@]}" "${RUNNER_TEMP}/xboard-bundle/"* "${SSH_TARGET}:${REMOTE_BUNDLE}/"
          printf '%s\n' "${GHCR_TOKEN}" | ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" "chmod 700 '${REMOTE_BUNDLE}/deploy.sh' && '${REMOTE_BUNDLE}/deploy.sh' '${REMOTE_BUNDLE}' '${GITHUB_ACTOR}'"

      - name: Verify public standalone admin, secure-path switch, legacy fallback, and restoration
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${PANEL_URL}/healthz" > /dev/null
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "${PANEL_URL}/" > /dev/null
          admin_page=$(mktemp)
          login_request=$(mktemp)
          login_response=$(mktemp)
          config_request=$(mktemp)
          config_response=$(mktemp)
          new_admin_page=$(mktemp)
          original_admin_page=$(mktemp)
          restored_admin_page=$(mktemp)
          NEXT_ADMIN_PATH="xboard-admin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          path_changed=0
          auth_data=""
          wait_for_standalone_page() {
            local url="$1"
            local destination="$2"
            local attempt
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "${url}" > "${destination}" &&
                grep --fixed-strings '<title>XBoard Admin</title>' "${destination}" > /dev/null &&
                grep --fixed-strings 'data-xboard-admin-shell="standalone"' "${destination}" > /dev/null &&
                grep --fixed-strings '/assets/' "${destination}" > /dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "ERROR: standalone administrator route did not converge" >&2
            return 1
          }
          wait_for_original_admin_page() {
            local url="$1"
            local destination="$2"
            local attempt
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "${url}" > "${destination}" &&
                grep --extended-regexp '<title>[^<]+</title>' "${destination}" > /dev/null &&
                grep --fixed-strings '/assets/admin/' "${destination}" > /dev/null &&
                ! grep --fixed-strings 'data-xboard-admin-shell="standalone"' "${destination}" > /dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "ERROR: original administrator fallback route did not converge" >&2
            return 1
          }
          restore_admin_path() {
            [ "${path_changed}" = "1" ] || return 0
            jq -n --arg path "${ADMIN_PATH}" '{secure_path: $path}' > "${config_request}" || return 1
            curl --fail --silent --show-error \
              --header "Authorization: ${auth_data}" \
              --header 'Content-Type: application/json' \
              --data-binary "@${config_request}" \
              "${PANEL_URL}/api/v2/${NEXT_ADMIN_PATH}/config/save" > "${config_response}" || return 1
            jq -e '.data == true' "${config_response}" > /dev/null || return 1
            path_changed=0
          }
          restore_on_exit() {
            status=$?
            if [ "${path_changed}" = "1" ] && [ -n "${auth_data}" ]; then
              if ! restore_admin_path; then
                echo "ERROR: could not restore the staging administrator path" >&2
              fi
            fi
            rm -f -- "${admin_page}" "${login_request}" "${login_response}" "${config_request}" "${config_response}" "${new_admin_page}" "${original_admin_page}" "${restored_admin_page}"
            exit "${status}"
          }
          trap restore_on_exit EXIT
          echo 'check=initial-standalone-route'
          wait_for_standalone_page "${PANEL_URL}/${ADMIN_PATH}/" "${admin_page}"
          echo 'check=administrator-login'
          jq -n --arg email "${ADMIN_ACCOUNT}" --arg password "${ADMIN_PASSWORD}" \
            '{email: $email, password: $password}' > "${login_request}"
          login_status=$(curl --silent --show-error --output "${login_response}" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data-binary "@${login_request}" \
            "${PANEL_URL}/api/v1/passport/auth/login")
          test "${login_status}" = "200"
          auth_data=$(jq -er '.data.auth_data | select(type == "string" and startswith("Bearer "))' "${login_response}")
          echo 'check=change-administrator-route'
          jq -n --arg path "${NEXT_ADMIN_PATH}" '{secure_path: $path}' > "${config_request}"
          curl --fail --silent --show-error \
            --header "Authorization: ${auth_data}" \
            --header 'Content-Type: application/json' \
            --data-binary "@${config_request}" \
            "${PANEL_URL}/api/v2/${ADMIN_PATH}/config/save" > "${config_response}"
          jq -e '.data == true' "${config_response}" > /dev/null
          path_changed=1
          echo 'check=changed-standalone-route'
          wait_for_standalone_page "${PANEL_URL}/${NEXT_ADMIN_PATH}/" "${new_admin_page}"
          echo 'check=changed-administrator-config'
          curl --fail --silent --show-error \
            --header "Authorization: ${auth_data}" \
            "${PANEL_URL}/api/v2/${NEXT_ADMIN_PATH}/config/fetch?key=safe" > "${config_response}"
          jq -e --arg path "${NEXT_ADMIN_PATH}" '.data.safe.secure_path == $path' "${config_response}" > /dev/null
          echo 'check=legacy-original-fallback'
          wait_for_original_admin_page "${PANEL_URL}/${NEXT_ADMIN_PATH}/original" "${original_admin_page}"
          echo 'check=restore-administrator-route'
          restore_admin_path
          echo 'check=restored-standalone-route'
          wait_for_standalone_page "${PANEL_URL}/${ADMIN_PATH}/" "${restored_admin_page}"

      - name: Remove sensitive deployment bundle
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          if [ -f "${SSH_DIR}/id_ed25519" ] && [ -n "${SSH_HOST:-}" ] && [ -n "${REMOTE_BUNDLE:-}" ]; then
            ssh -i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts" "${SSH_USER}@${SSH_HOST}" "case '${REMOTE_BUNDLE}' in /home/beihai/docker/.incoming/xboard-*) rm -rf -- '${REMOTE_BUNDLE}' ;; *) exit 1 ;; esac"
          fi
          rm -rf -- "${RUNNER_TEMP}/xboard-bundle" "${SSH_DIR}"

  deploy-production:
    name: Deploy JPGREEN production
    # Keep recovery implementation without deploying from CI.
    if: >-
      false &&
      inputs.release_version == '' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deployment_target == 'production'))
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: production-${{ github.repository_id }}
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_PANEL_URL }}
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      PANEL_URL: ${{ vars.PRODUCTION_PANEL_URL }}
      ADMIN_PATH: ${{ vars.PRODUCTION_ADMIN_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      XBOARD_IMAGE: ghcr.io/voidintheshell/xboard:${{ needs.build-and-push.outputs.image_tag }}
      DK_THEME_IMAGE: ${{ inputs.production_dk_theme_image || 'current' }}
      XBOARD_ADMIN_IMAGE: ${{ inputs.production_xboard_admin_image || 'current' }}
      RESET_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_jpgreen_data && 'reset' || 'preserve' }}
      RESET_CONFIRMATION: ${{ inputs.reset_confirmation || '' }}
    steps:
      - name: Validate production configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_HOST:?PRODUCTION_SSH_HOST is required}"
          : "${SSH_PORT:?PRODUCTION_SSH_PORT is required}"
          : "${SSH_USER:?PRODUCTION_SSH_USER is required}"
          : "${PANEL_URL:?PRODUCTION_PANEL_URL is required}"
          : "${ADMIN_PATH:?PRODUCTION_ADMIN_PATH is required}"
          : "${DEPLOY_SSH_KEY:?PRODUCTION_DEPLOY_SSH_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?PRODUCTION_SSH_KNOWN_HOSTS is required}"
          : "${DK_THEME_IMAGE:?PRODUCTION_DK_THEME_IMAGE is required}"
          : "${XBOARD_ADMIN_IMAGE:?PRODUCTION_XBOARD_ADMIN_IMAGE is required}"
          test "${PANEL_URL}" = 'https://panel.uegov.org'
          test "${ADMIN_PATH}" = 'unitedearthgov'
          test "${SSH_USER}" = 'xboard-ci'
          [[ "${XBOARD_IMAGE}" =~ ^ghcr\.io/voidintheshell/xboard:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          [[ "${DK_THEME_IMAGE}" = current || "${DK_THEME_IMAGE}" =~ ^ghcr\.io/voidintheshell/dk_theme:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          [[ "${XBOARD_ADMIN_IMAGE}" = current || "${XBOARD_ADMIN_IMAGE}" =~ ^ghcr\.io/voidintheshell/xboard-admin:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          if [ "${RESET_MODE}" = 'reset' ]; then
            test "${RESET_CONFIRMATION}" = 'RESET JPGREEN XBOARD DATA'
          else
            test "${RESET_MODE}" = 'preserve'
            test -z "${RESET_CONFIRMATION}"
          fi

      - name: Prepare restricted production SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          install -d -m 700 "${SSH_DIR}"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${SSH_DIR}/id_ed25519"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${SSH_DIR}/known_hosts"

      - name: Deploy production panel through the forced command
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          SSH_ARGS=(-i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")
          if [ "${RESET_MODE}" = 'reset' ]; then
            reset_marker='RESET_JPGREEN_XBOARD_DATA'
          else
            reset_marker='NO_RESET'
          fi
          printf '%s\n' "${GHCR_TOKEN}" | ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" \
            "deploy-xboard ${GITHUB_SHA} ${XBOARD_IMAGE} ${DK_THEME_IMAGE} ${XBOARD_ADMIN_IMAGE} ${GITHUB_ACTOR} ${RESET_MODE} ${reset_marker}"

      - name: Verify public entrypoints and protected runtime from JPGREEN
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          SSH_ARGS=(-i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${SSH_DIR}/known_hosts")
          ssh "${SSH_ARGS[@]}" "${SSH_TARGET}" verify-production

      - name: Remove the ephemeral deploy identity
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          rm -rf -- "${SSH_DIR}"

  release:
    name: Publish complete version
    # Compose acceptance is intentionally explicit test-environment work and
    # is not an automatic dev-publication dependency.  Keep release gated by
    # the frozen plan and the published image only.
    needs: [prepare-release, build-and-push]
    if: needs.prepare-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.prepare-release.outputs.plan_artifact }}
          path: ${{ runner.temp }}
      - name: Publish only after every required artifact is ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/release.py complete
