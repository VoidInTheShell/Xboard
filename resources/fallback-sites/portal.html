<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Service Portal</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f8;color:#122033}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#dbeafe 0,transparent 36%),#f8fafc}
    main{width:min(680px,calc(100% - 40px));padding:48px;border:1px solid #dbe2ea;border-radius:24px;background:rgba(255,255,255,.86);box-shadow:0 24px 80px rgba(15,23,42,.10)}
    .mark{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:#111827;color:#fff;font-weight:800;letter-spacing:.08em}
    h1{margin:28px 0 12px;font-size:clamp(2rem,6vw,3.5rem);line-height:1.04;letter-spacing:-.04em}p{margin:0;color:#64748b;font-size:1.05rem;line-height:1.8}
    footer{margin-top:44px;padding-top:20px;border-top:1px solid #e2e8f0;color:#94a3b8;font-size:.85rem}
    @media(prefers-color-scheme:dark){:root{background:#0b1220;color:#e5edf7}body{background:radial-gradient(circle at 20% 10%,#172554 0,transparent 38%),#080d17}main{background:rgba(15,23,42,.88);border-color:#263244}p{color:#9aa9bc}footer{border-color:#263244;color:#718096}}
  </style>
</head>
<body><main><div class="mark">UEG</div><h1>Service Portal</h1><p>This service is online and operating normally. Please use the official application to continue.</p><footer>Secure infrastructure · Operational status: Normal</footer></main></body>
</html>
