- name: 故障转移
  type: fallback
  proxies:
  - /(?i)^((?!(DIRECTLY|DIRECT|Proxy|Traffic|Expire|Expired|过期|剩余|流量|官网|超时|失效|Invalid|Test|测速|本地|Local)).)*$/
  - DIRECT
  url: https://cp.cloudflare.com/generate_204
  interval: 60
- name: 自动选择
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  tolerance: 20
  interval: 180
  proxies:
  - /(?i)^((?!(DIRECTLY|DIRECT|Proxy|Traffic|Expire|Expired|过期|剩余|流量|官网|超时|失效|Invalid|Test|测速|本地|Local)).)*$/
  - DIRECT
