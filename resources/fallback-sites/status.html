<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Status</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0c111b;color:#edf2f7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:100vh;display:grid;place-items:center}
    main{width:min(720px,calc(100% - 36px));border:1px solid #283241;border-radius:18px;background:#111824;overflow:hidden;box-shadow:0 30px 90px #0008}
    header{display:flex;align-items:center;gap:9px;padding:15px 18px;border-bottom:1px solid #283241}.dot{width:10px;height:10px;border-radius:50%;background:#334155}.dot:first-child{background:#ef4444}.dot:nth-child(2){background:#f59e0b}.dot:nth-child(3){background:#22c55e}
    section{padding:44px}h1{margin:0 0 12px;font-size:clamp(1.8rem,5vw,3rem);letter-spacing:-.04em}.ok{display:inline-flex;align-items:center;gap:8px;margin-top:28px;padding:9px 13px;border:1px solid #185e3b;border-radius:999px;background:#0d2f21;color:#86efac}.pulse{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 5px #22c55e22}p{color:#94a3b8;line-height:1.75}
  </style>
</head>
<body><main><header><span class="dot"></span><span class="dot"></span><span class="dot"></span></header><section><h1>System Status</h1><p>The requested service endpoint is available.</p><div class="ok"><span class="pulse"></span>All systems operational</div></section></main></body>
</html>
