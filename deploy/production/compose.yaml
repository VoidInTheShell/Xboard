name: jpgreen-xboard

x-xboard-volumes: &xboard-volumes
  - ./.env:/www/.env
  - ./data:/www/.docker/.data
  - ./logs:/www/storage/logs
  - ./uploads:/www/storage/app/public
  - ./themes:/www/storage/theme
  - ./plugins:/www/plugins
  - ./redis:/data

# Container output is separate from the mounted panel log budget.
x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  xboard:
    image: ${XBOARD_IMAGE:?XBOARD_IMAGE is required}
    logging: *container-logging
    container_name: xboard-app
    restart: unless-stopped
    init: true
    expose:
      - "7001"
    volumes: *xboard-volumes
    environment:
      RESOURCE_PROFILE: minimal
      ENABLE_WEB: "true"
      ENABLE_HORIZON: "true"
      ENABLE_REDIS: "true"
      ENABLE_WS_SERVER: "true"
      ENABLE_CADDY: "true"
      ADMIN_ROUTE_TOKEN_FILE: /run/secrets/admin_route_token
      docker: "true"
    secrets:
      - admin_route_token
    networks:
      - xboard-internal
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7001/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 75s

  bootstrap:
    image: ${XBOARD_IMAGE:?XBOARD_IMAGE is required}
    logging: *container-logging
    profiles: ["bootstrap"]
    restart: "no"
    init: true
    volumes:
      - ./.env:/www/.env
      - ./data:/www/.docker/.data
      - ./logs:/www/storage/logs
      - ./uploads:/www/storage/app/public
      - ./themes:/www/storage/theme
      - ./plugins:/www/plugins
      - ./redis:/data
      - ./bootstrap:/bootstrap:ro
      - ./backups:/backups
      - ./runtime-secrets:/runtime-secrets
    environment:
      APP_ENV: production
      APP_URL: ${PRODUCTION_PANEL_URL:?PRODUCTION_PANEL_URL is required}
      ENABLE_SQLITE: "true"
      ENABLE_REDIS: "true"
      ADMIN_ACCOUNT: ${PRODUCTION_ADMIN_ACCOUNT:?PRODUCTION_ADMIN_ACCOUNT is required}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SERVER_TOKEN_FILE: /run/secrets/server_token
      TEST_USER_PASSWORD_FILE: /run/secrets/test_user_password
      PRODUCTION_TEST_USER_EMAIL: ${PRODUCTION_TEST_USER_EMAIL:?PRODUCTION_TEST_USER_EMAIL is required}
      MCP_KEY_OUTPUT_FILE: /runtime-secrets/xboard_mcp_key
      PRODUCTION_BOOTSTRAP_CONFIRM: "1"
      docker: "true"
    secrets:
      - admin_password
      - server_token
      - test_user_password
    networks:
      - xboard-internal

  admin:
    image: ${XBOARD_ADMIN_IMAGE:?XBOARD_ADMIN_IMAGE is required}
    logging: *container-logging
    container_name: xboard-admin
    restart: unless-stopped
    init: true
    expose:
      - "80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - xboard-internal
    mem_limit: 64m
    mem_reservation: 16m
    cpus: 0.25
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  theme:
    image: ${DK_THEME_IMAGE:?DK_THEME_IMAGE is required}
    logging: *container-logging
    container_name: xboard-theme
    restart: unless-stopped
    depends_on:
      xboard:
        condition: service_healthy
      admin:
        condition: service_healthy
    expose:
      - "80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    environment:
      ADMIN_ROUTE_TOKEN_FILE: /run/secrets/admin_route_token
    secrets:
      - admin_route_token
    networks:
      - xboard-internal
      - bw-services
    mem_limit: 32m
    mem_reservation: 8m
    cpus: 0.25
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  xboard-internal:
    internal: true
  bw-services:
    external: true

secrets:
  admin_password:
    file: ./secrets/admin_password
  server_token:
    file: ./secrets/server_token
  test_user_password:
    file: ./secrets/test_user_password
  admin_route_token:
    file: ./secrets/admin_route_token
