proxy-groups:
  -
    name: PROXY
    type: select
    proxies:
      - 自动选择
      - 全部手选
      - 地区手选
      - AI稳定
      - AI优选
      - DIRECT
  -
    name: 自动选择
    type: url-test
    proxies:
      - '/^(?:\[[^\]]+\])?\s*(?:JP|GE) /'
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 600
    tolerance: 50
  -
    name: 全部手选
    type: select
    proxies:
      - '/^(?:\[[^\]]+\])?\s*(?:JP|GE) /'
  -
    name: 地区手选
