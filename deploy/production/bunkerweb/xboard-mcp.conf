# XBOARD-MCP-COMPAT
# The authenticated MCP endpoint carries JSON-RPC payloads that can trigger
# generic CRS rules. Keep the exception exact and leave all other panel paths
# under the service-wide ModSecurity policy and existing request limits.
location = /api/mcp {
    modsecurity off;
    # Keep JSON-RPC authentication responses as JSON instead of replacing
    # them with the server-level BunkerWeb HTML error document.
    proxy_intercept_errors off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;
    client_max_body_size 2m;

    proxy_pass http://xboard-theme:80;
}

# XBOARD-NODE-CONTROL-COMPAT
# Machine/node control requests contain opaque tokens, UUIDs and runtime
# telemetry that trigger the stock CRS on this host. Limit the exception to
# Xboard's authenticated server APIs; user, administrator and theme paths keep
# the service-wide ModSecurity policy.
location ^~ /api/v2/server/ {
    modsecurity off;
    # Preserve machine-auth JSON 401/403 responses. The enclosing server
    # enables proxy_intercept_errors for ordinary web paths.
    proxy_intercept_errors off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;
    client_max_body_size 4m;

    proxy_pass http://xboard-theme:80;
}

location ^~ /api/v1/server/ {
    modsecurity off;
    # Preserve node-auth JSON 401/403 responses for the agent.
    proxy_intercept_errors off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;
    client_max_body_size 4m;

    proxy_pass http://xboard-theme:80;
}
