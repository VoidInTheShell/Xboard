name: xboard

# Default topology: Xboard keeps its existing embedded Web/Horizon/WebSocket/
# Redis process layout, while the user-facing Theme, the standalone Admin,
# the private updater, and the one-shot bootstrap run as separate services.
# Set XBOARD_DEPLOY_DIR to the same absolute path on the host and inside
# xboard-updater; the updater must be able to hand the exact Compose file path
# to the host Docker daemon. The deployment directory and its parent paths
# must be traversable by the user-namespaced updater (usually mode 0751/0755);
# keep .env and secrets at 0600.
#
# The theme container is the canonical panel entry: it serves the user
# frontend, proxies the panel API to the backend, and routes the runtime
# administrator path to xboard-admin (/<active-path>/original keeps the
# built-in administrator view). Both the backend and the theme read the same
# administrator route token; create it before the first start with:
#
#   install -d -m 0755 "${XBOARD_DEPLOY_DIR}/secrets"
#   umask 027 && head -c 32 /dev/urandom | base64 | tr -d '=+/' \
#     > "${XBOARD_DEPLOY_DIR}/secrets/admin_route_token"
#   chown root:1000 "${XBOARD_DEPLOY_DIR}/secrets/admin_route_token"
#
# For a public 80/443 HTTPS entry, add compose.entry.sample.yaml (Caddy with
# automatic ACME, managed by the panel updater) or join the theme service to
# an existing reverse-proxy network with your own overlay.

x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-xboard-volumes: &xboard-volumes
  - ${XBOARD_DEPLOY_DIR:?Set XBOARD_DEPLOY_DIR to the absolute deployment directory}/.env:/www/.env
  - ${XBOARD_DEPLOY_DIR}/.docker/.data:/www/.docker/.data
  - ${XBOARD_DEPLOY_DIR}/storage/logs:/www/storage/logs
  - ${XBOARD_DEPLOY_DIR}/storage/app/public:/www/storage/app/public
  - ${XBOARD_DEPLOY_DIR}/storage/theme:/www/storage/theme
  - ${XBOARD_DEPLOY_DIR}/plugins:/www/plugins
  - ${XBOARD_DEPLOY_DIR}/secrets/admin_route_token:/run/secrets/admin_route_token:ro
  - xboard-redis-data:/data

services:
  xboard:
    image: ghcr.io/voidintheshell/xboard:${XBOARD_VERSION:?Set XBOARD_VERSION to an exact published Xboard version}
    container_name: xboard-app
    logging: *container-logging
    restart: unless-stopped
    init: true
    ports:
      - "${XBOARD_PORT:-7001}:7001"
    volumes: *xboard-volumes
    environment:
      APP_ENV: production
      RESOURCE_PROFILE: ${RESOURCE_PROFILE:-balanced}
      ENABLE_WEB: "true"
      ENABLE_HORIZON: "true"
      ENABLE_REDIS: "true"
      ENABLE_WS_SERVER: "true"
      ENABLE_CADDY: "true"
      ADMIN_ROUTE_TOKEN_FILE: /run/secrets/admin_route_token
      docker: "true"
    networks:
      - xboard-internal
      - xboard-egress
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7001/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 75s

  xboard-admin:
    image: ghcr.io/voidintheshell/xboard-admin:${XBOARD_ADMIN_VERSION:?Set XBOARD_ADMIN_VERSION to the exact Admin release version}
    container_name: xboard-admin
    logging: *container-logging
    restart: unless-stopped
    init: true
    depends_on:
      xboard:
        condition: service_healthy
    expose:
      - "80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - xboard-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  xboard-theme:
    image: ghcr.io/voidintheshell/dk_theme:${XBOARD_THEME_VERSION:?Set XBOARD_THEME_VERSION to the exact DK Theme release version}
    container_name: xboard-theme
    logging: *container-logging
    restart: unless-stopped
    init: true
    depends_on:
      xboard:
        condition: service_healthy
      xboard-admin:
        condition: service_healthy
    ports:
      - "${XBOARD_THEME_PORT:-7002}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ${XBOARD_DEPLOY_DIR}/secrets/admin_route_token:/run/secrets/admin_route_token:ro
    environment:
      ADMIN_ROUTE_TOKEN_FILE: /run/secrets/admin_route_token
    networks:
      # Docker silently drops published ports for containers attached only to
      # an internal network; the egress bridge is what makes XBOARD_THEME_PORT
      # reachable from the host.
      - xboard-internal
      - xboard-egress
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  updater-bootstrap:
    image: ghcr.io/voidintheshell/xboard:${XBOARD_VERSION:?Set XBOARD_VERSION to the same exact Xboard release above}
    logging: *container-logging
    restart: "no"
    init: true
    depends_on:
      xboard:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    volumes:
      - ${XBOARD_DEPLOY_DIR}/.env:/www/.env:ro
      - ${XBOARD_DEPLOY_DIR}/.docker/.data:/www/.docker/.data
      - ${XBOARD_DEPLOY_DIR}/deploy/updater/bootstrap.sh:/bootstrap/bootstrap.sh:ro
      - ${XBOARD_DEPLOY_DIR}/deploy/updater/panel-hook.sh:/bootstrap/panel-hook.sh:ro
      - ${XBOARD_ENV_FILE:-${XBOARD_DEPLOY_DIR}/.env}:/bootstrap/deploy.env:ro
      - updater-config:/etc/xboard-updater
      - updater-state:/var/lib/xboard-updater
    environment:
      XBOARD_PANEL_URL: ${XBOARD_PANEL_URL:?Set XBOARD_PANEL_URL to the HTTPS panel URL}
      XBOARD_THEME_HEALTH_URL: ${XBOARD_THEME_HEALTH_URL:-http://xboard-theme/healthz}
      XBOARD_ENTRY_ENABLED: ${XBOARD_ENTRY_ENABLED:-}
      XBOARD_PANEL_DOMAIN: ${XBOARD_PANEL_DOMAIN:-}
      XBOARD_ADMIN_VERSION: ${XBOARD_ADMIN_VERSION}
      XBOARD_DEPLOY_DIR: ${XBOARD_DEPLOY_DIR}
      XBOARD_COMPOSE_FILE: ${XBOARD_COMPOSE_FILE:-${XBOARD_DEPLOY_DIR}/compose.yaml}
      XBOARD_ENV_FILE: ${XBOARD_ENV_FILE:-${XBOARD_DEPLOY_DIR}/.env}
      XBOARD_COMPOSE_EXTRA_FILE: ${XBOARD_COMPOSE_EXTRA_FILE:-}
      XBOARD_HEALTH_URL: ${XBOARD_HEALTH_URL:-http://xboard-app:7001/}
      XBOARD_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-xboard}
      XBOARD_BACKEND_CONTAINER: xboard-app
    networks:
      - xboard-internal

  xboard-updater:
    image: ghcr.io/voidintheshell/xboard-admin-updater:${XBOARD_UPDATER_VERSION:?Set XBOARD_UPDATER_VERSION equal to XBOARD_ADMIN_VERSION}
    container_name: xboard-updater
    logging: *container-logging
    restart: unless-stopped
    init: true
    depends_on:
      xboard:
        condition: service_healthy
      updater-bootstrap:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - updater-config:/etc/xboard-updater
      - updater-state:/var/lib/xboard-updater
      - updater-backups:/var/lib/xboard-updater/backups
      # This exact path must exist on the host. The updater passes it to the
      # host Docker daemon for Compose operations and never mounts / from host.
      - ${XBOARD_DEPLOY_DIR}:${XBOARD_DEPLOY_DIR}
    networks:
      - xboard-internal
      - xboard-egress

volumes:
  xboard-redis-data:
  updater-config:
  updater-state:
  updater-backups:

networks:
  xboard-internal:
    internal: true
  xboard-egress:
    driver: bridge
