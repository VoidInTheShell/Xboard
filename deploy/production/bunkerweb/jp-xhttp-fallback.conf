# XBOARD-JP-XHTTP-FALLBACK
# Keep the node's existing, more-specific XHTTP location unchanged.  This
# exact root location only makes ordinary browser requests look like the
# normal ai.uegov.org site.
location = / {
    proxy_http_version 1.1;
    proxy_set_header Host ai.uegov.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_ssl_server_name on;
    proxy_ssl_name ai.uegov.org;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 5;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_intercept_errors off;
    proxy_pass https://ai.uegov.org/;
}
